apisix:
  node_listen: 9080              # APISIX listening port
  enable_ipv6: false

  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092
  data_encryption:
    enable_encrypt_fields: false
  lua_module_hook: apisix.dataease_log_rotate

deployment:
  admin:
    allow_admin:
      - 0.0.0.0/0

    admin_key:
      - name: "admin"
        key: DE_APISIX_KEY
        role: admin

  etcd:
    host:
      - "http://apisix-etcd:2379"
    prefix: "/apisix"
    timeout: 30

plugin_attr:
  log-rotate:
    interval: 86400
    max_size: 52428800 # 50 MiB per log file
    max_kept: 5 # Historical files per log
