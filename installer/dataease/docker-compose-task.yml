services:
  task-actuator:
    environment:
      DE_SYNC_AUTH_ENABLED: ${DE_SYNC_AUTH_ENABLED:-false}
      DE_SYNC_AUTH_SECRET: ${DE_SYNC_AUTH_SECRET:-}
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:-} -XX:-UseBASE64Intrinsics"
    image: registry.cn-qingdao.aliyuncs.com/dataease/dataease-sync-task:DE_TAG
    container_name: sync-task-actuator
    volumes:
      - ${DE_BASE}/dataease3.0/logs:/opt/dataease3.0/logs
    networks:
      - dataease-network3
