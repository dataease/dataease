spring:
    datasource:
        url: jdbc:oracle:thin:@${DE_DB_HOST}:${DE_DB_PORT}/${DE_DB_DATABASE}?${DE_DB_PARAMS}
        username: ${DE_DB_USER}
        password: ${DE_DB_PASSWORD}
        driver-class-name: oracle.jdbc.OracleDriver
        hikari:
            connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = ${DE_DB_SCHEMA}

    jpa:
        database-platform: org.hibernate.dialect.OracleDialect
        properties:
            hibernate:
                dialect: io.dataease.config.DataEaseOracle11gDialect
                auto_quote_keyword: false
                jdbc:
                    batch_size: 1000
                    lob:
                        non_contextual_creation: true
                order_inserts: true
                order_updates: true
                temp:
                    use_jdbc_metadata_defaults: false
        hibernate:
            naming:
                physical-strategy: io.dataease.config.DynamicCaseNamingStrategy
            ddl-auto: update
        show-sql: false
